<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classic Client – Play</title>
<style>
:root{--bg:#1b1d22;--panel:#25282f;--line:#343843;--txt:#e8e8ea;--mut:#9aa0ab;--acc:#e2231a}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(17,19,23,.92);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:5;border-bottom:2px solid var(--acc)}
#top b{font-size:16px;margin-right:10px}#top button,#top select{background:#2d313a;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer}
#top button.on{background:var(--acc);border-color:var(--acc)}#top a{color:var(--mut);margin-left:auto;text-decoration:none}
#stage{position:fixed;inset:44px 0 0 0}#stage canvas{display:block;width:100%;height:100%}
#panel{position:fixed;top:56px;right:12px;width:300px;max-height:calc(100% - 70px);overflow:auto;background:rgba(37,40,47,.96);border:1px solid var(--line);border-radius:8px;padding:14px;z-index:4}
#panel h3{margin:0 0 10px;font-size:15px}.row{display:flex;align-items:center;justify-content:space-between;margin:7px 0;gap:8px}
.row label{color:var(--mut)}.sw{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}.sw i{width:22px;height:22px;border-radius:3px;cursor:pointer;border:2px solid transparent}.sw i.on{border-color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:4px}.seg button{background:#2d313a;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer;font:inherit;font-size:13px}.seg button.on{background:var(--acc);border-color:var(--acc)}
input[type=text]{background:#111317;border:1px solid var(--line);color:var(--txt);border-radius:4px;padding:6px 8px;font:inherit;width:100%}
#help{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:6px;font-size:12px;z-index:4}
#nametag{position:fixed;pointer-events:none;font-weight:700;text-shadow:0 1px 3px #000;transform:translate(-50%,-100%);z-index:3;white-space:nowrap}
#loading{position:fixed;inset:44px 0 0 0;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(0,0,0,.4);z-index:6}
.hide{display:none!important}
</style></head><body>
<div id="top"><b>Classic Client</b>
<button id="tAvatar" class="on">Avatar</button><button id="tPlay">Play</button>
<select id="world"><option value="base">Baseplate</option><option value="Places/Mobile.rbxl">Mobile</option></select>
<a href="./">← Back to models</a></div>
<div id="stage"></div>
<div id="nametag"></div>
<div id="loading" class="hide">Loading world…</div>

<div id="panel">
<h3>Your avatar</h3>
<div class="row"><label>Name</label></div><input type="text" id="aName" maxlength="20">
<div id="parts"></div>
<div class="row"><label>Hat</label></div><div class="seg" id="hats"></div>
<div class="row"><label>Face</label></div><div class="seg" id="faces"></div>
<div class="row" style="margin-top:14px"><button id="aRandom" class="seg" style="all:unset;cursor:pointer;color:#ff6b63">🎲 Randomize</button><button id="aReset" style="all:unset;cursor:pointer;color:var(--mut)">Reset</button></div>
<p style="color:var(--mut);font-size:12px">Saved automatically in this browser.</p>
</div>
<div id="help" class="hide">WASD / arrows: move · Space: jump · Right-drag: turn camera · Scroll: zoom · R: respawn</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {parseRbxBinary} from './rbxl.js';
const $=id=>document.getElementById(id);

// ---------------- avatar data ----------------
const PALETTE=['#f2f3f3','#a3a2a5','#635f62','#1b2a35','#c4281c','#da8541','#f5cd30','#4b974b','#287f47','#0d69ac','#6e99ca','#6b327c','#e8bac8','#cc8e69','#a05f35','#d7c59a','#ffcc99','#7c5c46','#00ffff','#111111'];
const PARTS=[['head','Head'],['torso','Torso'],['larm','Left arm'],['rarm','Right arm'],['lleg','Left leg'],['rleg','Right leg']];
const HATS=['None','Cap','Top hat','Crown','Cone','Headphones'];
const FACES=['Smile','Grin','Cool','Surprised','Blank'];
const DEFAULT={name:'Player',head:'#ffcc99',torso:'#0d69ac',larm:'#ffcc99',rarm:'#ffcc99',lleg:'#635f62',rleg:'#635f62',hat:'None',face:'Smile',hatColor:'#c4281c'};
let A;try{A={...DEFAULT,...JSON.parse(localStorage.getItem('cc_avatar')||'{}')};}catch{A={...DEFAULT};}
const save=()=>{try{localStorage.setItem('cc_avatar',JSON.stringify(A));}catch{}};

function faceTexture(kind){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#000';g.strokeStyle='#000';g.lineWidth=7;g.lineCap='round';
  if(kind==='Cool'){g.fillRect(22,38,36,16);g.fillRect(70,38,36,16);g.fillRect(56,42,16,5);}
  else if(kind!=='Blank'){g.beginPath();g.ellipse(44,48,7,kind==='Surprised'?12:10,0,0,7);g.fill();g.beginPath();g.ellipse(84,48,7,kind==='Surprised'?12:10,0,0,7);g.fill();}
  g.beginPath();
  if(kind==='Smile'||kind==='Cool'){g.arc(64,70,26,.2*Math.PI,.8*Math.PI);g.stroke();}
  else if(kind==='Grin'){g.arc(64,72,28,0,Math.PI);g.closePath();g.fill();g.fillStyle='#fff';g.fillRect(44,73,40,8);}
  else if(kind==='Surprised'){g.ellipse(64,92,9,12,0,0,7);g.fill();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function box(w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));m.castShadow=true;return m;}
function buildHat(kind,color){
  const g=new THREE.Group(),M=new THREE.MeshLambertMaterial({color});
  if(kind==='Cap'){const a=new THREE.Mesh(new THREE.SphereGeometry(.62,20,10,0,Math.PI*2,0,Math.PI/2),M);a.scale.set(1,.7,1);g.add(a);const b=box(1,.08,.6,color);b.position.set(0,0,-.75);g.add(b);g.position.y=.45;}
  if(kind==='Top hat'){const b=new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,.08,24),M),t=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,1,24),M);t.position.y=.5;g.add(b,t);g.position.y=.5;}
  if(kind==='Crown'){const r=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.3,8,1,true),new THREE.MeshLambertMaterial({color:'#f5cd30',side:THREE.DoubleSide}));g.add(r);
    for(let i=0;i<8;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(.1,.3,4),new THREE.MeshLambertMaterial({color:'#f5cd30'}));const a=i/8*Math.PI*2;s.position.set(Math.cos(a)*.52,.3,Math.sin(a)*.52);g.add(s);}g.position.y=.65;}
  if(kind==='Cone'){const c=new THREE.Mesh(new THREE.ConeGeometry(.55,1.3,20),M);c.position.y=.65;g.add(c);g.position.y=.5;}
  if(kind==='Headphones'){const band=new THREE.Mesh(new THREE.TorusGeometry(.7,.07,8,24,Math.PI),M);band.rotation.z=0;g.add(band);
    for(const x of[-.7,.7]){const e=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.2,16),M);e.rotation.z=Math.PI/2;e.position.x=x;g.add(e);}g.position.y=0;}
  return g;
}
// Character: origin at feet. Height 5 (legs 2, torso 2, head 1).
function buildCharacter(a){
  const root=new THREE.Group(),j={};
  const torso=box(2,2,1,a.torso);torso.position.y=3;root.add(torso);
  const head=new THREE.Group();head.position.y=4.5;root.add(head);
  const hm=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,1.2,24),[new THREE.MeshLambertMaterial({color:a.head}),new THREE.MeshLambertMaterial({color:a.head}),new THREE.MeshLambertMaterial({color:a.head})]);
  hm.rotation.y=Math.PI;hm.castShadow=true;head.add(hm);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:faceTexture(a.face),transparent:true}));face.position.set(0,0,-.605);face.rotation.y=Math.PI;head.add(face);
  if(a.hat!=='None')head.add(buildHat(a.hat,a.hatColor));
  const limb=(color,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);const m=box(1,2,1,color);m.position.y=-1;p.add(m);root.add(p);return p;};
  j.larm=limb(a.larm,-1.5,4);j.rarm=limb(a.rarm,1.5,4);j.lleg=limb(a.lleg,-.5,2);j.rleg=limb(a.rleg,.5,2);
  root.userData.j=j;return root;
}

// ---------------- avatar editor UI ----------------
function swatches(key){return `<div class="row"><label>${PARTS.find(p=>p[0]===key)?.[1]||'Hat color'}</label></div><div class="sw" data-k="${key}">`+PALETTE.map(c=>`<i style="background:${c}" data-c="${c}" class="${A[key]===c?'on':''}"></i>`).join('')+'</div>';}
function drawUI(){
  $('aName').value=A.name;
  $('parts').innerHTML=PARTS.map(p=>swatches(p[0])).join('')+swatches('hatColor');
  $('hats').innerHTML=HATS.map(h=>`<button class="${A.hat===h?'on':''}">${h}</button>`).join('');
  $('faces').innerHTML=FACES.map(h=>`<button class="${A.face===h?'on':''}">${h}</button>`).join('');
  document.querySelectorAll('.sw i').forEach(i=>i.onclick=()=>{A[i.parentNode.dataset.k]=i.dataset.c;changed();});
  $('hats').querySelectorAll('button').forEach(b=>b.onclick=()=>{A.hat=b.textContent;changed();});
  $('faces').querySelectorAll('button').forEach(b=>b.onclick=()=>{A.face=b.textContent;changed();});
}
$('aName').oninput=()=>{A.name=$('aName').value||'Player';save();$('nametag').textContent=A.name;};
$('aRandom').onclick=()=>{const r=a=>a[Math.floor(Math.random()*a.length)];for(const[k]of PARTS)A[k]=r(PALETTE);A.hatColor=r(PALETTE);A.hat=r(HATS);A.face=r(FACES);changed();};
$('aReset').onclick=()=>{A={...DEFAULT,name:A.name};changed();};
function changed(){save();drawUI();respawnChar(false);}

// ---------------- scene ----------------
const host=$('stage'),R3=new THREE.WebGLRenderer({antialias:true});R3.setPixelRatio(Math.min(devicePixelRatio,2));R3.outputColorSpace=THREE.SRGBColorSpace;R3.shadowMap.enabled=true;host.appendChild(R3.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8cc4f0);scene.fog=new THREE.Fog(0x8cc4f0,250,900);
scene.add(new THREE.HemisphereLight(0xffffff,0x667755,1.3));
const sun=new THREE.DirectionalLight(0xffffff,1.7);sun.position.set(60,120,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-120,right:120,top:120,bottom:-120,far:400});scene.add(sun,sun.target);
const cam=new THREE.PerspectiveCamera(60,1,.1,3000);
const orbit=new OrbitControls(cam,R3.domElement);orbit.enableDamping=true;
const resize=()=>{const w=host.clientWidth,h=host.clientHeight;R3.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();};addEventListener('resize',resize);resize();

function studTex(n){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,64,64);
  g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.arc(34,34,17,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(31,31,17,0,7);g.fill();g.strokeStyle='rgba(0,0,0,.12)';g.lineWidth=2;g.strokeRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(n,n);t.colorSpace=THREE.SRGBColorSpace;return t;}

let world=new THREE.Group(),colliders=[],spawn=new THREE.Vector3(0,0,0),killY=-200;scene.add(world);
function baseplate(size=512,y=0){const m=new THREE.Mesh(new THREE.BoxGeometry(size,1,size),[0,1,2,3,4,5].map(i=>new THREE.MeshLambertMaterial({color:0x4b974b,map:i===2?studTex(size/4):null})));
  m.position.y=y-.5;m.receiveShadow=true;return m;}
function partMesh(p){
  const [sx,sy,sz]=p.s,col=new THREE.Color(...p.c),op=1-p.t,M=()=>new THREE.MeshLambertMaterial({color:col,transparent:op<1,opacity:op});
  let g;
  if(p.sh==='Ball')g=new THREE.SphereGeometry(sx/2,32,20);
  else if(p.sh==='Cylinder'){g=new THREE.CylinderGeometry(Math.min(sy,sz)/2,Math.min(sy,sz)/2,sx,32);g.rotateZ(Math.PI/2);}
  else if(p.sh==='Wedge'){const x=sx/2,y=sy/2,z=sz/2;g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([-x,-y,-z,x,-y,-z,x,-y,z,-x,-y,z,-x,y,z,x,y,z],3));g.setIndex([0,1,2,0,2,3,3,2,5,3,5,4,0,4,5,0,5,1,0,3,4,1,5,2]);g.computeVertexNormals();}
  else g=new THREE.BoxGeometry(sx,sy,sz);
  const m=new THREE.Mesh(g,M());if(p.sh==='Wedge')m.material.side=THREE.DoubleSide;
  const cf=p.cf;m.matrixAutoUpdate=false;m.matrix.set(cf[3],cf[4],cf[5],cf[0],cf[6],cf[7],cf[8],cf[1],cf[9],cf[10],cf[11],cf[2],0,0,0,1);m.matrixWorldNeedsUpdate=true;
  m.castShadow=op>.5;m.receiveShadow=true;return m;
}
async function loadWorld(src){
  $('loading').classList.remove('hide');
  scene.remove(world);world=new THREE.Group();colliders=[];scene.add(world);
  try{
    if(src==='base'){const b=baseplate();world.add(b);colliders.push(b);spawn.set(0,0,0);killY=-100;}
    else{
      const parts=parseRbxBinary(await (await fetch(src)).arrayBuffer());
      const box=new THREE.Box3();
      for(const p of parts){
        const ghost=p.cls==='MeshPart'||p.cls==='UnionOperation';
        const m=partMesh(p);
        if(!ghost)colliders.push(m);                     // invisible parts still collide (e.g. invisible baseplates)
        if(p.t<.99&&!ghost)world.add(m);else{m.visible=false;world.add(m);}
        if(p.t<.99)box.expandByPoint(new THREE.Vector3(p.cf[0],p.cf[1],p.cf[2]));
      }
      world.updateMatrixWorld(true);
      const spawnPart=parts.find(p=>p.cls==='SpawnLocation');
      const c=spawnPart?new THREE.Vector3(spawnPart.cf[0],spawnPart.cf[1],spawnPart.cf[2]):box.getCenter(new THREE.Vector3());
      const hit=new THREE.Raycaster(new THREE.Vector3(c.x,500,c.z),new THREE.Vector3(0,-1,0)).intersectObjects(colliders,false)[0];
      spawn.set(c.x,hit?hit.point.y+.1:c.y+5,c.z);killY=box.min.y-150;
    }
  }catch(e){alert('Could not load world: '+e.message);}
  $('loading').classList.add('hide');respawnChar(true);
}

// ---------------- player ----------------
let char=null,pos=new THREE.Vector3(),vel=new THREE.Vector3(),yaw=0,onGround=false,walkT=0;
function respawnChar(reset){
  const old=char;char=buildCharacter(A);char.traverse(o=>o.castShadow=true);scene.add(char);if(old)scene.remove(old);
  if(reset||!old){pos.copy(spawn);vel.set(0,0,0);}
  char.position.copy(pos);char.rotation.y=yaw;$('nametag').textContent=A.name;
  if(mode==='avatar'){orbit.target.set(pos.x,pos.y+3,pos.z);}
}
const keys={};addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;if(e.code==='Space')e.preventDefault();if(e.code==='KeyR'&&mode==='play'){pos.copy(spawn);vel.set(0,0,0);}});
addEventListener('keyup',e=>keys[e.code]=false);
const ray=new THREE.Raycaster();
function step(dt){
  const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  const fwd=new THREE.Vector3();cam.getWorldDirection(fwd);fwd.y=0;fwd.normalize();const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0));
  const move=fwd.multiplyScalar(f).add(right.multiplyScalar(s));const moving=move.lengthSq()>0;
  if(moving){move.normalize();const target=Math.atan2(move.x,move.z)+Math.PI;let d=target-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));yaw+=d*Math.min(1,dt*12);}
  vel.x=move.x*16;vel.z=move.z*16;vel.y-=196.2*dt*.5;
  if(keys.Space&&onGround){vel.y=50;onGround=false;}
  // horizontal collision: cast at 3 heights in move direction
  const hv=new THREE.Vector3(vel.x,0,vel.z),hl=hv.length()*dt;
  if(hl>0){const dir=hv.clone().normalize();
    for(const h of[.6,2.5,4.5]){ray.set(new THREE.Vector3(pos.x,pos.y+h,pos.z),dir);ray.far=hl+1;const hit=ray.intersectObjects(colliders,false)[0];
      if(hit){ // try stepping up small ledges at foot height
        if(h===.6){ray.set(new THREE.Vector3(pos.x+dir.x*(hl+1),pos.y+2.2,pos.z+dir.z*(hl+1)),new THREE.Vector3(0,-1,0));ray.far=2.2;const up=ray.intersectObjects(colliders,false)[0];
          if(up&&up.point.y-pos.y<=1.6&&onGround){pos.y=up.point.y;continue;}}
        const n=hit.face?hit.face.normal.clone().transformDirection(hit.object.matrixWorld):dir.clone().negate();n.y=0;n.normalize();
        const into=hv.dot(n);if(into<0){hv.addScaledVector(n,-into);}vel.x=hv.x;vel.z=hv.z;}}
  }
  pos.x+=vel.x*dt;pos.z+=vel.z*dt;
  // vertical
  const dy=vel.y*dt;ray.set(new THREE.Vector3(pos.x,pos.y+2,pos.z),new THREE.Vector3(0,-1,0));ray.far=2+Math.max(0,-dy)+.05;
  const g=ray.intersectObjects(colliders,false)[0];
  if(vel.y<=0&&g){pos.y=g.point.y;vel.y=0;onGround=true;}
  else{if(vel.y>0){ray.set(new THREE.Vector3(pos.x,pos.y+4.9,pos.z),new THREE.Vector3(0,1,0));ray.far=dy+.2;if(ray.intersectObjects(colliders,false)[0])vel.y=0;}
    pos.y+=vel.y*dt;onGround=false;}
  if(pos.y<killY){pos.copy(spawn);vel.set(0,0,0);}
  // animate
  const j=char.userData.j;walkT+=moving&&onGround?dt*9:0;const sw=moving&&onGround?Math.sin(walkT)*.9:0,air=onGround?0:-.5;
  j.larm.rotation.x=sw+(onGround?0:Math.PI*.9);j.rarm.rotation.x=-sw+(onGround?0:Math.PI*.9);j.lleg.rotation.x=-sw+air*-.3;j.rleg.rotation.x=sw+air*.3;
  if(!moving&&onGround){j.larm.rotation.x=j.rarm.rotation.x=j.lleg.rotation.x=j.rleg.rotation.x=0;}
  char.position.copy(pos);char.rotation.y=yaw;
  // camera follows
  const target=new THREE.Vector3(pos.x,pos.y+4.5,pos.z);cam.position.add(target.clone().sub(orbit.target));orbit.target.copy(target);
  sun.position.set(pos.x+60,pos.y+120,pos.z+40);sun.target.position.copy(pos);
}

// ---------------- modes ----------------
let mode='avatar';
function setMode(m){mode=m;$('tAvatar').classList.toggle('on',m==='avatar');$('tPlay').classList.toggle('on',m==='play');
  $('panel').classList.toggle('hide',m!=='avatar');$('help').classList.toggle('hide',m!=='play');
  orbit.mouseButtons={LEFT:m==='play'?null:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE};orbit.enablePan=m!=='play';
  if(m==='avatar'){vel.set(0,0,0);yaw=0;char.rotation.y=0;orbit.target.set(pos.x,pos.y+3,pos.z);cam.position.set(pos.x+3,pos.y+5,pos.z-11);orbit.minDistance=4;orbit.maxDistance=40;}
  else{orbit.target.set(pos.x,pos.y+4.5,pos.z);cam.position.set(pos.x,pos.y+12,pos.z+20);orbit.minDistance=6;orbit.maxDistance=120;}
}
$('tAvatar').onclick=()=>setMode('avatar');$('tPlay').onclick=()=>setMode('play');
$('world').onchange=()=>loadWorld($('world').value);

const clock=new THREE.Clock(),tag=$('nametag');
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);
  if(char){if(mode==='play')step(dt);else{char.rotation.y+=dt*.4;}}
  orbit.update();R3.render(scene,cam);
  if(char){const p=new THREE.Vector3(pos.x,pos.y+6.3,pos.z).project(cam);tag.style.display=p.z<1?'block':'none';
    tag.style.left=((p.x+1)/2*host.clientWidth)+'px';tag.style.top=(44+(1-p.y)/2*host.clientHeight)+'px';}
})();

drawUI();await loadWorld('base');setMode('avatar');
</script></body></html>
